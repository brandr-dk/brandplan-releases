<!doctype html><html lang="da"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex, nofollow"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Brandplan"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="theme-color" content="#b41e32"><link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="manifest" href="manifest.webmanifest"></head><body><title>Brandr Brandplan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: tegnebord i midten, værktøjskasse til venstre, egenskaber til højre — som et Bluebeam-arbejdsbord */
:root {
  --bg: #e9ebee; --panel: #f8f9fa; --ink: #1b1f24; --muted: #5d6670; --line: #d3d8de;
  --table: #c9ced5; --accent: #b41e32; --accent-ink: #ffffff; --sel: #0a6cff; --ok: #1d7a4f; --warn: #b4560a;
  --chip: #eef0f3; --hover: #e7eaee;
  --f-ui: "IBM Plex Sans", -apple-system, "Helvetica Neue", Arial, sans-serif;
  --f-num: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #15181c; --panel: #1d2126; --ink: #e8ebee; --muted: #9aa3ad; --line: #2f353c; --table: #0f1114;
  --accent: #e0475b; --accent-ink: #ffffff; --sel: #4d97ff; --ok: #4cc28b; --warn: #f0a050; --chip: #262b31; --hover: #2a3037; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #15181c; --panel: #1d2126; --ink: #e8ebee; --muted: #9aa3ad; --line: #2f353c; --table: #0f1114;
  --accent: #e0475b; --accent-ink: #ffffff; --sel: #4d97ff; --ok: #4cc28b; --warn: #f0a050; --chip: #262b31; --hover: #2a3037; color-scheme: dark; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font: 13px/1.4 var(--f-ui); overflow: hidden; }
#app { display: grid; grid-template-rows: auto 1fr auto; height: 100%; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--sel); outline-offset: 1px; }

/* top bar */
.bar { display: flex; align-items: center; gap: 10px; padding: 8px max(12px, env(safe-area-inset-right, 0px)) 8px max(12px, env(safe-area-inset-left, 0px)); background: var(--panel); border-bottom: 1px solid var(--line); min-width: 0; }
.brand { display: flex; align-items: baseline; gap: 8px; font-weight: 600; letter-spacing: .01em; white-space: nowrap; }
.brand .mark { width: 22px; height: 22px; align-self: center; }
.brand small { font-weight: 400; color: var(--muted); }
.file { color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; flex: 1; font-size: 12px; }
.file b { color: var(--ink); font-weight: 500; }
.tag { font-size: 11px; padding: 1px 6px; border-radius: 3px; background: var(--chip); color: var(--warn); margin-left: 6px; }
.grp-b { display: flex; align-items: center; gap: 2px; background: var(--chip); border-radius: 6px; padding: 2px; }
.ib { border: 0; background: transparent; padding: 4px 8px; border-radius: 4px; min-width: 28px; }
.ib:hover { background: var(--hover); }
.ib:disabled { opacity: .4; cursor: default; }
.num { font-family: var(--f-num); font-size: 12px; min-width: 46px; text-align: center; font-variant-numeric: tabular-nums; }
.btn { border: 1px solid var(--line); background: var(--panel); padding: 5px 10px; border-radius: 5px; white-space: nowrap; }
.btn:hover { background: var(--hover); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 500; }
.btn.primary:hover { filter: brightness(1.08); }
.btn.danger { color: var(--accent); }
.btn:disabled { opacity: .6; }
.only-narrow { display: none; }

/* main */
.main { display: grid; grid-template-columns: 264px 1fr 300px; min-height: 0; }
aside { background: var(--panel); min-height: 0; overflow: auto; }
.left { border-right: 1px solid var(--line); display: flex; flex-direction: column; overflow: hidden; }
.right { border-left: 1px solid var(--line); }
.tools { display: grid; grid-template-columns: repeat(5, 1fr); gap: 2px; padding: 10px; border-bottom: 1px solid var(--line); }
.tool { display: flex; flex-direction: column; align-items: center; gap: 1px; border: 1px solid transparent; background: transparent; border-radius: 6px; padding: 5px 1px 4px; font-size: 10px; color: var(--muted); white-space: nowrap; min-width: 0; }
.tool svg { width: 20px; height: 20px; stroke: var(--ink); fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.tool:hover { background: var(--hover); }
.tool.on { background: var(--ink); color: var(--panel); }
.tool.on svg { stroke: var(--panel); }
.tool kbd { font-family: var(--f-num); font-size: 9px; opacity: .6; }
.search { padding: 10px 10px 4px; }
.search input { width: 100%; box-sizing: border-box; padding: 6px 9px; border: 1px solid var(--line); border-radius: 5px; background: var(--bg); }
#lib { padding: 0 6px 16px; flex: 1; overflow: auto; min-height: 0; }
details.grp { border-bottom: 1px solid var(--line); }
details.grp > summary { list-style: none; cursor: pointer; padding: 9px 6px; font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; display: flex; justify-content: space-between; }
details.grp > summary::-webkit-details-marker { display: none; }
details.grp > summary span { color: var(--muted); font-weight: 400; font-family: var(--f-num); }
.syms { display: grid; grid-template-columns: repeat(4, 1fr); gap: 3px; padding-bottom: 8px; }
.sym-item { border: 1px solid transparent; background: #fff; border-radius: 5px; padding: 5px 0 3px; display: flex; flex-direction: column; align-items: center; gap: 2px; }
.sym-item span { display: none; }
.sym-item:hover { border-color: var(--line); }
.sym-item.on { border-color: var(--sel); box-shadow: 0 0 0 1px var(--sel); }
.lines { display: grid; gap: 2px; padding-bottom: 8px; }
.line-item { display: grid; grid-template-columns: 44px 1fr; align-items: center; gap: 6px; text-align: left; border: 1px solid transparent; background: transparent; border-radius: 5px; padding: 3px 4px; font-size: 11.5px; }
.line-item svg { background: #fff; border-radius: 3px; }
.line-item:hover { background: var(--hover); }
.line-item.on { border-color: var(--sel); box-shadow: 0 0 0 1px var(--sel); }

.sym-add { border: 1px dashed var(--line); background: transparent; border-radius: 5px; font-size: 18px; color: var(--muted); display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 44px; }
.sym-add span { font-size: 10px; }
.sym-add:hover { border-color: var(--sel); color: var(--sel); }
.libbar { padding: 0 0 10px; }
.lnk { border: 0; background: none; color: var(--sel); padding: 0; font-size: 12px; text-decoration: underline; text-underline-offset: 2px; }
.tsec { grid-column: 1 / -1; font-size: 10px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); padding: 4px 2px 0; }
.colrow { display: grid; grid-template-columns: auto auto 1fr; align-items: center; gap: 6px; }
.colrow input[type="color"] { width: 34px; height: 26px; padding: 1px; border: 1px solid var(--line); border-radius: 4px; background: var(--bg); }
.colrow input[type="color"]:disabled { opacity: .35; }
.sw { display: flex; flex-wrap: wrap; gap: 3px; }
.sw button { width: 15px; height: 15px; border-radius: 3px; border: 1px solid rgba(0,0,0,.25); background: var(--c); padding: 0; }
.sw button:hover { transform: scale(1.15); }
.f input[type="range"] { padding: 0; border: 0; background: transparent; accent-color: var(--sel); }
.f output { font-family: var(--f-num); color: var(--ink); float: right; }
#inlineEd { position: absolute; z-index: 5; box-sizing: border-box; border: 1.5px dashed var(--sel); background: rgba(255,255,255,.9); font-family: Helvetica, Arial, sans-serif; resize: none; overflow: hidden; outline: none; margin: 0; }
.card.wide { width: min(620px, 100%); }
.symprev { display: flex; gap: 12px; align-items: center; }
.symprev svg { border: 1px solid var(--line); border-radius: 4px; }
.liblist { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; max-height: 300px; overflow: auto; }
.libitem { display: grid; grid-template-columns: 30px 1fr; gap: 8px; align-items: center; text-align: left; border: 1px solid var(--line); border-radius: 5px; padding: 4px 6px; background: var(--panel); }
.libitem svg { background: #fff; border-radius: 2px; }
.libitem small { display: block; color: var(--muted); font-size: 11px; }
.libitem:hover { border-color: var(--sel); }

.busy { position: absolute; inset: 0; display: grid; place-content: center; justify-items: center; gap: 12px; background: color-mix(in srgb, var(--table) 70%, transparent); z-index: 8; color: var(--ink); font-weight: 500; }
.spin { width: 28px; height: 28px; border-radius: 50%; border: 3px solid var(--line); border-top-color: var(--accent); animation: spin 0.9s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
#renderState { color: var(--muted); white-space: nowrap; }
.stylelist { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 10px; }
.styleitem { display: grid; grid-template-columns: 96px 1fr auto; align-items: center; gap: 8px; font-size: 12.5px; }
.styleitem svg { border: 1px solid var(--line); border-radius: 3px; display: block; }
.styleitem small { display: block; color: var(--muted); font-size: 11px; }
.card h4 { margin: 4px 0 0; font-size: 12px; text-transform: uppercase; letter-spacing: .05em; }
.help ol { margin: 0; padding-left: 20px; display: grid; gap: 6px; }
.help .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.help table { border-collapse: collapse; font-size: 12.5px; width: 100%; }
.help td { padding: 3px 4px; border-top: 1px solid var(--line); vertical-align: top; }
.help td:first-child { width: 1%; white-space: nowrap; padding-right: 10px; }
kbd { font-family: var(--f-num); font-size: 11px; background: var(--chip); border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 5px; white-space: nowrap; }
.card.wide { max-height: calc(100vh - 48px); overflow: auto; }
@media (max-width: 640px) { .stylelist, .help .cols { grid-template-columns: 1fr; } }
@media (prefers-reduced-motion: reduce) { .spin { animation: none; } }

.notes { background: var(--chip); border-radius: 6px; padding: 10px 12px; font-size: 12.5px; max-height: 180px; overflow: auto; }
.progress { height: 6px; background: var(--chip); border-radius: 3px; overflow: hidden; }
.progress div { height: 100%; width: 0; background: var(--accent); transition: width .2s; }

/* 0.7: ikke gemt, rækkefølge, sider, genveje */
#fileName.unsaved::after { content: "●"; color: var(--warn); margin-left: 6px; font-size: 10px; vertical-align: 1px; }
.zrow { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
.zrow .btn { padding: 5px 4px; font-size: 12px; }
.btn.on { border-color: var(--sel); box-shadow: inset 0 0 0 1px var(--sel); }
.btn kbd, .muted kbd { font-size: 10px; padding: 0 4px; }
.pgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; max-height: 52vh; overflow: auto; padding: 2px; }
.pcard { position: relative; display: grid; gap: 4px; justify-items: center; padding: 8px; border: 1px solid var(--line); border-radius: 6px; cursor: pointer; font-size: 12px; background: var(--bg); }
.pcard.cur { border-color: var(--sel); }
.pcard input { position: absolute; top: 6px; left: 6px; }
.pcard canvas { max-width: 150px; max-height: 150px; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.2); }
.pcard:has(input:not(:checked)) canvas { opacity: .3; }
.pcard:has(input:not(:checked)) span { text-decoration: line-through; color: var(--muted); }
.keys .kq { width: 100%; box-sizing: border-box; padding: 6px 9px; border: 1px solid var(--line); border-radius: 5px; background: var(--bg); }
.keys .kcols { columns: 2 280px; column-gap: 22px; }
.keys section { break-inside: avoid; margin-bottom: 12px; }
.keys table { border-collapse: collapse; width: 100%; font-size: 12.5px; }
.keys td { padding: 3px 4px; border-top: 1px solid var(--line); vertical-align: top; }
.keys td:first-child { width: 1%; white-space: nowrap; padding-right: 10px; }
.card.keys { width: min(760px, 100%); }
.keys .kact { font-size: 12px; color: var(--muted); }
#pageInfo { cursor: pointer; }
/* 0.8: startskærm */
button.brand { border: 0; background: transparent; padding: 2px 4px; margin: -2px -4px; border-radius: 6px; cursor: pointer; font: inherit; font-weight: 600; color: inherit; }
button.brand:hover { background: var(--hover, rgba(0,0,0,.05)); }
body.nodoc #wrap { visibility: hidden; }
body.nodoc #props, body.nodoc .left { opacity: .55; pointer-events: none; }
body.nodoc #btnExport, body.nodoc #btnDeliver { opacity: .5; pointer-events: none; }
.empty.start { background: var(--bg); z-index: 5; overflow: auto; padding: 24px; }
.st-card { width: min(560px, 100%); display: grid; gap: 18px; justify-items: center; }
.st-logo { display: flex; align-items: center; gap: 14px; }
.st-logo svg { width: 64px; height: 64px; }
.st-logo div { text-align: left; line-height: 1.1; }
.st-logo b { display: block; font-size: 30px; font-weight: 600; letter-spacing: -.01em; }
.st-logo span { font-size: 15px; color: var(--muted); }
.st-dz { width: 100%; box-sizing: border-box; display: grid; justify-items: center; gap: 6px; padding: 34px 20px; border: 2px dashed var(--line); border-radius: 12px; background: var(--panel); cursor: pointer; transition: border-color .15s, background .15s; }
.st-dz svg { width: 34px; height: 34px; fill: none; stroke: var(--muted); stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.st-dz b { font-size: 15px; font-weight: 500; }
.st-dz:hover, #stage.drop .st-dz { border-color: var(--accent); }
#stage.drop .st-dz { background: color-mix(in srgb, var(--accent) 6%, var(--panel)); }
.st-acts { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
.st-acts .btn { padding: 8px 14px; font-size: 13px; }
.st-acts kbd { font-size: 10px; margin-left: 4px; opacity: .8; background: transparent; border-color: currentColor; color: inherit; }
.st-recent { width: 100%; text-align: left; }
.st-recent h4 { margin: 0 0 6px; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.st-rec { display: grid; grid-template-columns: 1fr auto; gap: 0 12px; width: 100%; text-align: left; border: 0; border-top: 1px solid var(--line); background: transparent; padding: 7px 6px; border-radius: 0; cursor: pointer; font: inherit; color: inherit; }
.st-rec:hover { background: var(--panel); }
.st-rec b { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.st-rec span { grid-column: 1; font-size: 11.5px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.st-rec em { grid-row: 1 / span 2; grid-column: 2; align-self: center; font-style: normal; font-size: 11.5px; color: var(--muted); }
.st-foot a { color: inherit; }
/* drawing table */
.stage { position: relative; overflow: auto; user-select: none; -webkit-user-select: none; background: var(--table); min-width: 0; touch-action: none; }
.stage[data-tool="pan"], .stage.space { cursor: grab; }
.stage.panning { cursor: grabbing; }
.stage[data-tool="sym"], .stage[data-tool="line"], .stage[data-tool="area"], .stage[data-tool="calib"], .stage[data-tool="mlen"], .stage[data-tool="walk"], .stage[data-tool="marea"], .stage[data-tool="arrow"], .stage[data-tool="leader"], .stage[data-tool="title"], .stage[data-tool="legend"] { cursor: crosshair; }
.stage[data-tool="text"], .stage[data-tool="box"] { cursor: text; }
.stage[data-tool="callout"], .stage[data-tool="cloud"], .stage[data-tool="cloudbox"], .stage[data-tool="rect"], .stage[data-tool="ellipse"], .stage[data-tool="pen"], .stage[data-tool="addleader"] { cursor: crosshair; }
.stage.drop { outline: 3px dashed var(--sel); outline-offset: -8px; }
#wrap { position: relative; }
#sheet { position: absolute; left: 48px; top: 48px; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.15), 0 6px 24px rgba(0,0,0,.18); }
#sheet canvas { position: absolute; left: 0; top: 0; }
#cvBase { width: 100%; height: 100%; }
#ov { position: absolute; left: 0; top: 0; overflow: visible; }
#ov text { user-select: none; }
#ov g, #ov use, #ov path, #ov text, #ov image, #ov circle { pointer-events: none; }
#ov .vh { pointer-events: all; cursor: move; }
.empty { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; color: var(--ink); }
.empty .card { max-width: 380px; }

/* properties */
.right section { padding: 14px 14px 16px; border-bottom: 1px solid var(--line); display: grid; gap: 9px; }
.right h3 { margin: 0; font-size: 12px; text-transform: uppercase; letter-spacing: .05em; display: flex; justify-content: space-between; align-items: baseline; }
.right h4 { margin: 6px 0 0; font-size: 12px; }
.muted { color: var(--muted); margin: 0; font-size: 12px; }
.sm { font-size: 11px; text-transform: none; letter-spacing: 0; font-weight: 400; }
.f { display: grid; gap: 3px; min-width: 0; }
.f > span { font-size: 11.5px; color: var(--muted); }
.f input, .f select, .f textarea, .door input { width: 100%; box-sizing: border-box; padding: 5px 7px; border: 1px solid var(--line); border-radius: 4px; background: var(--bg); min-width: 0; }
.f input[type="color"] { padding: 1px; height: 30px; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.chk { display: flex; gap: 6px; align-items: center; font-size: 12.5px; }
.acts { display: flex; gap: 6px; flex-wrap: wrap; }
.big { font-family: var(--f-num); font-size: 22px; margin: 0; font-variant-numeric: tabular-nums; }
.scale { display: flex; align-items: baseline; gap: 10px; }
.scale b { font-family: var(--f-num); font-size: 20px; font-weight: 500; }
.ok { color: var(--ok); font-size: 12px; } .warnc { color: var(--warn) !important; font-size: 12px; }
.warn { color: var(--warn); margin: 0; font-size: 12px; }
.door { display: grid; grid-template-columns: 22px 1fr; align-items: center; gap: 6px; margin-bottom: 4px; }
.door b { font-family: var(--f-num); text-align: center; color: #fff; background: #ed2124; border-radius: 50%; width: 20px; height: 20px; display: grid; place-items: center; font-size: 11px; }
table.cnt { width: 100%; border-collapse: collapse; font-size: 12px; }
table.cnt th { text-align: left; font-weight: 500; color: var(--muted); font-size: 11px; padding: 2px 4px; }
table.cnt td { padding: 3px 4px; border-top: 1px solid var(--line); vertical-align: middle; }
table.cnt .n { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
table.cnt .cur { background: color-mix(in srgb, var(--sel) 8%, transparent); }
table.cnt .tot { font-weight: 600; }
table.cnt.cntbig { font-size: 13px; margin-bottom: 6px; table-layout: fixed; }
table.cnt.cntbig th:first-child { width: 30px; }
table.cnt.cntbig th.n { width: 66px; }
table.cnt.cntbig td:nth-child(2) { max-width: 340px; }
tr.hlrow { cursor: pointer; }
tr.hlrow:hover td { background: color-mix(in srgb, #ff8a00 8%, transparent); }
tr.hlrow.on td { background: color-mix(in srgb, #ff8a00 16%, transparent); }
.card.count { max-height: 82vh; overflow: auto; }
.card.count h4 { margin: 14px 0 4px; }
.cntline { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 6px 0 10px; font-size: 12.5px; }
table.cnt td:nth-child(n+3), table.cnt th:nth-child(n+3) { text-align: right; font-family: var(--f-num); font-variant-numeric: tabular-nums; }
table.cnt svg { background: #fff; border-radius: 2px; display: block; }

/* status */
.status { display: flex; gap: 16px; align-items: center; padding: 5px max(12px, env(safe-area-inset-right, 0px)) calc(5px + env(safe-area-inset-bottom, 0px)) max(12px, env(safe-area-inset-left, 0px)); background: var(--panel); border-top: 1px solid var(--line); font-size: 12px; color: var(--muted); min-width: 0; }
#hint { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#coords, #scaleChip { font-family: var(--f-num); font-variant-numeric: tabular-nums; white-space: nowrap; }
#scaleChip { color: var(--ink); }

.modal { position: fixed; inset: 0; background: rgba(10,14,20,.45); display: grid; place-items: center; z-index: 50; padding: 16px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 18px; width: min(380px, 100%); display: grid; gap: 12px; box-shadow: 0 10px 40px rgba(0,0,0,.3); }
.card h3 { margin: 0; }
.card .acts { justify-content: flex-end; }
#toast { position: fixed; left: 50%; bottom: calc(44px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--panel); padding: 8px 14px; border-radius: 6px; z-index: 60; max-width: calc(100% - 32px); }

@media (max-width: 1000px) {
  .main { grid-template-columns: 1fr; position: relative; }
  aside { position: absolute; top: 0; bottom: 0; z-index: 20; width: min(300px, 86vw); box-shadow: 0 8px 30px rgba(0,0,0,.25); display: none !important; }
  .left { left: 0; } .right { right: 0; }
  body.show-left .left { display: flex !important; }
  body.show-right .right { display: block !important; }
  .only-narrow { display: inline-block; }
  .hide-narrow { display: none; }
}
@media (max-width: 560px) { .brand small, .file, #coords { display: none; } .bar { flex-wrap: wrap; } }
/* Touch og kontroltilstand */
.only-touch { display: none; }
.casechip { margin: 0 0 8px; padding: 8px 10px; background: var(--chip); border-radius: 6px; font-size: 13px; line-height: 1.35; }
table.cnt .in { width: 100%; font: inherit; padding: 4px 6px; border: 1px solid var(--line); border-radius: 4px; background: var(--panel); color: var(--ink); }
body.touch .only-touch { display: inline-block; }
body.touch .ib, body.touch .btn { min-height: 40px; }
body.touch .ib { min-width: 40px; }
html, body { -webkit-tap-highlight-color: transparent; }
button, .bar { touch-action: manipulation; }
.vbar { display: none; }
body.viewer .main { grid-template-columns: 1fr; position: relative; }
body.viewer .left, body.viewer .right { display: none !important; }
body.viewer.show-right .right { display: block !important; position: absolute; top: 0; bottom: 0; right: 0; z-index: 20; width: min(320px, 90vw); box-shadow: 0 8px 30px rgba(0,0,0,.25); }
body.viewer #btnDeliver, body.viewer #tglLeft, body.viewer .grp-b[aria-label="Zoom"], body.viewer #coords { display: none !important; }
body.viewer #tglRight { display: inline-block; }
body.viewer .vbar { display: flex; align-items: stretch; gap: 2px; position: absolute; left: 50%; transform: translateX(-50%); bottom: calc(12px + env(safe-area-inset-bottom)); z-index: 15; padding: 5px; max-width: calc(100% - 16px); overflow-x: auto;
  background: var(--panel); border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 6px 24px rgba(0,0,0,.18); }
.vbar button { flex: 0 0 auto; min-width: 54px; min-height: 50px; padding: 5px 6px 4px; border: 0; border-radius: 10px; background: none; color: var(--ink);
  font: 500 11px/1.1 var(--f-ui); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; cursor: pointer; }
.vbar button svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.vbar button.on { background: var(--chip); color: var(--accent); }
.vbar button.del { color: var(--accent); }
.vbar .vsep { width: 1px; background: var(--line); margin: 6px 3px; }
body.viewer #toast { bottom: calc(96px + env(safe-area-inset-bottom)); }
@media (max-width: 420px) { .vbar button { min-width: 46px; font-size: 10px; padding: 4px 3px; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

/* optælling på tværs af sider: signaturer (stk.), bygningsdele (m), områder (m²) */
function tally() {
  const N = pdfDoc ? pdfDoc.numPages : doc.pages.length, row = () => Array(N).fill(0);
  const sym = new Map(), line = new Map(), area = new Map(), uncal = new Set();
  const add = (map, k, i, v) => { if (!map.has(k)) map.set(k, row()); map.get(k)[i] += v; };
  doc.pages.forEach((p, i) => p && p.marks.forEach(m => {
    if (m.t === 'sym' && SYMBYID[m.id]) add(sym, m.id, i, 1);
    else if (m.t === 'line' && LINES[m.style]) { add(line, m.style, i, polyLen(m.pts) / ppm(p)); if (!p.ptPerM) uncal.add(i); }
    else if (m.t === 'area' && AREAS[m.style]) { add(area, m.style, i, polyArea(m.pts) / ppm(p) ** 2); if (!p.ptPerM) uncal.add(i); }
  }));
  const ord = M => new Map([...M].sort((a, b) => a[0] < b[0] ? -1 : 1));
  return { N, sym: ord(sym), line, area, uncal };
}

        const md = modal(`<div class="card"><h3>Ikke-gemt arbejde fundet</h3>

          <p class="muted sm">Senest ændret kl. ${esc(t)} · ${n} markering${n === 1 ? '' : 'er'}${d.path ? '<br>' + esc(d.path.split('/').slice(-2).join(' / ')) : ''}</p>

const Recent = {
  KEY: 'brandr.recent',
  list() { try { return JSON.parse(Platform.ls.get(this.KEY) || '[]').filter(x => x && x.path); } catch (e) { return []; } },
  add(path) {
    if (!path || !Platform.isTauri) return;

    Platform.ls.set(this.KEY, JSON.stringify(l.slice(0, 8)));

  $('#btnUndo').onclick = undo; $('#btnRedo').onclick = redo; $('#btnHelp').onclick = helpDialog;
  $('#btnPrev').onclick = () => gotoPage(pageNo - 1); $('#btnNext').onclick = () => gotoPage(pageNo + 1);
  $('#zIn').onclick = () => applyZoom(zoom * 1.25); $('#zOut').onclick = () => applyZoom(zoom / 1.25); $('#zFit').onclick = fitPage;
  $('#tglLeft').onclick = () => document.body.classList.toggle('show-left');
  $('#tglRight').onclick = () => document.body.classList.toggle('show-right');
  $('#stVer').textContent = APPV + (Platform.isTauri ? ' · Mac-app' : ' · webudgave');
  stage.addEventListener('dragover', e => { e.preventDefault(); stage.classList.add('drop'); });
  stage.addEventListener('dragleave', () => stage.classList.remove('drop'));
  stage.addEventListener('drop', e => { e.preventDefault(); stage.classList.remove('drop'); const f = e.dataTransfer.files[0]; if (f && /pdf/i.test(f.type + f.name)) loadDroppedPdf(f); else if (f && /svg/i.test(f.type + f.name)) toast('Brug «Nyt symbol» under Brandr-symboler for at importere SVG.'); });
  window.addEventListener('beforeunload', e => { if (dirty) { Recovery.saveNow(); e.preventDefault(); e.returnValue = ''; } });
  guardWindowClose();
  $('#btnKeys').onclick = shortcutsDialog;
  $('#pageInfo').onclick = () => pdfDoc && pagesDialog();
  setTool('select');
  if (!window.pdfjsLib || !window.PDFLib) { showStart(true); $('#emptyMsg').textContent = 'PDF-bibliotekerne kunne ikke indlæses. Tjek netforbindelsen og genindlæs siden.'; return; }
  await loadLib().catch(e => console.warn(e));
  Recovery.start();
  const restored = await Recovery.offer().catch(e => { console.warn(e); return false; });
  if (!restored) showStart(true);
  Updater.start();
}
/* Mac-appen: spørg, før vinduet lukkes med ikke-gemte ændringer */
async function guardWindowClose() {
  const T = window.__TAURI__;
  const W = T && T.window && (T.window.getCurrentWindow ? T.window.getCurrentWindow() : T.window.appWindow);
  if (!Platform.isTauri || !W || !W.onCloseRequested) return;
  try {
    await W.onCloseRequested(async ev => {
      if (!dirty) return;
      ev.preventDefault();
      await Recovery.saveNow();
      if (await confirmBox('Du har ændringer, der ikke er gemt. Luk alligevel? (Arbejdet tilbydes gendannet næste gang, programmet åbnes.)', 'Luk uden at gemme')) { dirty = false; await W.destroy(); }
    });
  } catch (e) { console.warn(e); }
}
boot();

</script>
